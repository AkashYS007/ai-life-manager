name: CI

# Deployment maturity pass (2026-08-27): the missing backend/web CI gate,
# flagged since the architecture audit and re-confirmed at every later audit
# (Update 49 finding #15's sibling gap, Update 61's roadmap item #18). Runs
# on every push and pull request targeting `main` so a broken build/lint/test
# is caught before it lands, not after Railway/Vercel already deployed it.
#
# Scope: build + lint + unit test for both apps, plus (Production Hardening
# Sprint 1, 2026-08-29) the backend's real e2e suite (test/app.e2e-spec.ts)
# against a real Postgres service container — closing the gap this same
# comment used to document as still open. That suite is fully self-contained
# (AnthropicClient and every other real external integration is either
# mocked or exercises its own graceful *_NOT_CONFIGURED path — see the
# suite's own comments), so a real database is the only infrastructure it
# ever needed; nothing else was blocking this.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push on the same branch/PR cancels an in-flight run for it, so a
# rapid sequence of commits (this repo's own established multi-file commit
# pattern) doesn't queue up redundant runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # prisma generate validates that its schema's env("DATABASE_URL") resolves
  # to *something* before it will run, even though generate itself never
  # opens a real connection — this placeholder is never used to connect.
  DATABASE_URL: 'postgresql://ci:ci@localhost:5432/ci_placeholder'

jobs:
  backend:
    name: Backend (build, lint, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    # Real Postgres for the e2e suite below — a plain, ephemeral,
    # single-run container (GitHub's own Docker daemon on ubuntu-latest
    # runs it natively, no separate setup step needed), never reused across
    # runs and never reachable from outside this job.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ailm_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install workspace dependencies
        working-directory: .
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Apply database migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: 'postgresql://ci:ci@localhost:5432/ailm_ci'

      - name: E2E tests
        run: npm run test:e2e
        env:
          DATABASE_URL: 'postgresql://ci:ci@localhost:5432/ailm_ci'
          # The same dev-auth bypass local development already uses (see
          # auth.guard.ts's own comment) — lets the suite authenticate as
          # many distinct throwaway identities via a plain header instead of
          # needing a real Clerk project. env.validation.ts only refuses
          # AUTH_MODE=dev when NODE_ENV=production, so NODE_ENV=test below
          # keeps this path open exactly as it already is for local dev.
          AUTH_MODE: 'dev'
          NODE_ENV: 'test'
          # Ephemeral CI-only passphrase for the Microsoft/Apple calendar
          # token-encryption path (see token-cipher.ts) — those two
          # integrations' services all pull this via
          # config.get('TOKEN_ENCRYPTION_KEY')! with no fallback, so
          # without it every real connect/sync call in this suite fails
          # closed with a generic CONNECT_FAILED/SYNC_FAILED rather than
          # succeeding. A previous attempt to add this line used the wrong
          # indentation (nested it outside the `env:` map instead of
          # alongside AUTH_MODE/NODE_ENV above), which is why it was
          # reverted rather than left in — same key, correct indentation
          # this time.
          TOKEN_ENCRYPTION_KEY: 'ci-only-calendar-token-key'
          # web-push.service.ts's vapidPublicKey resolver returns
          # `process.env.VAPID_PUBLIC_KEY ?? null` — with no value set at
          # all, that's a legitimate `null`, but the e2e test round-trips
          # this against `process.env.VAPID_PUBLIC_KEY` read from inside
          # the same Jest process, which is `undefined` (not `null`) when
          # unset — so the test fails on a type mismatch alone even though
          # nothing is actually broken. A fixed CI-only value here makes
          # both sides agree on a real, defined string, the same fix
          # shape as TOKEN_ENCRYPTION_KEY above.
          VAPID_PUBLIC_KEY: 'ci-only-test-vapid-public-key'

  web:
    name: Web (build, lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      # next build statically prerenders /, /privacy, /terms, which mount
      # <ClerkProvider> through the root layout — without a real Clerk key
      # that throws "Missing publishableKey" and fails the build. Providers.tsx
      # already has a sanctioned escape hatch for exactly this situation
      # (no real Clerk credentials available): AUTH_MODE=dev skips
      # <ClerkProvider> entirely, the same mode local dev and the sandbox
      # environment use. CI has no real Clerk credentials and shouldn't need
      # any — this is a build-time smoke test, not a deploy.
      NEXT_PUBLIC_AUTH_MODE: 'dev'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install workspace dependencies
        working-directory: .
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        # No standalone unit-test runner is configured for apps/web — this
        # project's established pattern is tsc (enforced implicitly by
        # `next build`) plus the Playwright e2e suite, which needs a live
        # backend this CI job doesn't stand up. See README's own
        # "Still untested" section.
        run: npm run build
